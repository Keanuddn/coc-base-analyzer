# Visual-tier proxy for synthetic renders — NOT official Clash of Clans caps.
#
# This repo has no verified per-TH upgrade table:
#   - building_type_map.yaml: slug aliases only
#   - ml/configs/th_classes.yaml: YOLO class names only
#   - knowledge-base/: missing
#
# TH18 is the current max Town Hall (2026). ClashKing ships
# town_hall/level_18.webp. Treating TH16 as "highest sprite" is wrong.
#
# Policy (heuristic: visual-tier proxy, not official CoC cap), with
# user-corrected merge exceptions in building_type_map.yaml era_merges:
#   - Generate TH in {15, 16, 17, 18} when town_hall/level_{N}.webp exists.
#     Skip a TH (and report) if that exact hall sprite is missing.
#   - town_hall sprite = exact town_hall/level_{N}.webp for that image.
#   - Default defenses: one sprite level per type per image (no leftover mix):
#       TH18 → highest ClashKing file for that building
#       TH17 → max-1
#       TH16 → max-2
#       TH15 → max-3
#   - Clamp at 1. If a building has fewer files than the offset needs,
#     use the lowest available file — do not wrap into a higher-era sprite.
#   - Exceptions (user):
#       canon: TH15 = highest regular cannon (cannon/level_21.webp, purple max).
#         TH16–18 = ricochet_cannon (no regular cannons). YOLO class canon
#         (temporary alias — merged cannon visual).
#       wizztower: maxed at TH17 (wizard_tower/level_17.webp). TH15/16 = max-2 /
#         max-1 relative to that. TH18 = super_wizard_tower. YOLO class wizztower.
#       archertower: same merge as cannons. TH15 = archer_tower/level_21.webp
#         (purple max). TH16–18 = multi-archer_tower (no regular archer towers).
#         YOLO class archertower is a placeholder (not in keremberke 16).
#       bombtower: normal visual-tier (no merge).
#       eagle: only TH15–16 (skip TH17/TH18). Visual-tier among eagle files
#         relative to eagle max_th (16), not TH18: TH16 = highest file,
#         TH15 = max-1. Avoids leftover level_4/5 (TH14-looking).
#       firespitter: only TH17+ (skip TH15/TH16). Visual-tier among 3 files.
#       spelltower: four ClashKing files (level_1…4). Place all four designs
#         per layout (one of each) on TH15 / TH17 / TH18 — not at TH16.
#         If occupancy cannot fit 4, cycle remaining variants across a batch.
#       wall: ClashKing wall/ folder. Visual-tier from maxed TH18:
#         TH18 = highest wall file, TH17 = max-1, TH16 = max-2, TH15 = max-3.
#         1×1 tiles around/between buildings. Rendered, not YOLO-labeled.

policy: visual-tier-proxy
not_official_coc_cap: true
era_max_town_hall: 18
town_hall_levels_generated: [15, 16, 17, 18]

# Highest level_*.webp observed in ClashKing Home Village folders (local download).
# Rows cite the CDN object for that max file. This is sprite coverage, not a TH unlock table.
# Atlas: https://github.com/ClashKingInc/ClashKingAssets
# CDN template: https://assets.clashk.ing/buildings/home-village/{slug}/level_{n}.webp
