# Versioned class list for CoC Base Analyzer YOLO training.
# v2: keremberke 16-class head (indices 0–15 frozen) + appended TH15+ defenses.
version: 2
source_model: keremberke/yolov5m-clash-of-clans

# Keremberke YOLOv5 head — fixed indices 0..15, do not reorder.
# IDs 16+ are synthetic-only until real screenshots are relabeled.
