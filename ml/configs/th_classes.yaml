# Hero altar pads — removed from CoC; baseline model mislabels TH15/16 screenshots.
deprecated_classes:
  - kingpad
  - queenpad
  - rcpad
  - wardenpad

deprecated_notes: |
  Hero altar "pad" classes from keremberke's 2021–2024 TH13-era training.
  King/Queen/Royal Champion/Warden pads no longer exist as separate map tiles in
  current bases; the baseline model hallucinates them on ground tiles, decorations,
  and hero-altar-adjacent clutter. Pseudo-labels filter them out by default.
  Use pseudo_label --include-deprecated to retain them (not recommended for review).
  IDs 7/9/10/13 stay reserved so the 4 user-labeled reals are not remapped.

# Town-hall level classes would break the 4 real files (they use th13). Keep halls as th13.
placeholders:
  - th14
  - th15
  - th16
  - th17
  - th18

notes: |
  Indices 0–15 match keremberke/yolov5m-clash-of-clans. Do not shuffle them.
  TH14–TH18 town halls share the th13 slot (safer than a new hall class).
  Appended defenses (16–26) are trained from synthetic labels. Real GT for those
  buildings is incomplete until screenshots are relabeled. Walls are never labeled.
  ClashKing sprite folders: archer_tower, hidden_tesla, monolith, spell_tower,
  ricochet_cannon, multi-archer_tower, firespitter, multi-gear_tower,
  revenge_tower, super_wizard_tower, builder's_hut.
