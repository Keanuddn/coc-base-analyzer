# Maps project building_type identifiers → ClashKing sprite folder slugs.
# Verified against docs/ARCHITECTURE.md (YOLO labels) and link_decoder/schema.py.
#
# Sprite path template:
#   clashking/home-village/{clashking_slug}/level_{level}.webp
#
# Town Hall: use town_hall/level_{town_hall_level}.webp (not the th13 YOLO class name).

aliases:
  ad: air_defense
  airsweeper: air_sweeper
  bombtower: bomb_tower
  canon: cannon
  clancastle: clan_castle
  eagle: eagle_artillery
  inferno: inferno_tower
  mortar: mortar
  scattershot: scattershot
  wizztower: wizard_tower
  xbow: x-bow
  monolith: monolith
  spelltower: spell_tower
  archertower: archer_tower
  firespitter: firespitter
  tesla: hidden_tesla
  builderhut: "builder's_hut"

# Temporary YOLO aliases for merged defenses that keremberke's 16 classes
# do not include. Sprites are still rendered for visual correctness.
# User needs detection of "cannon-like" / "wizard-like" / "archer-like"
# until dedicated classes (`ricochet`, `archertower`, etc.) are added.
yolo_label_overrides:
  ricochet_cannon: canon  # merged cannon visual (2× maxed TH15 cannons)
  super_wizard_tower: wizztower  # merged wizard visual (2× maxed TH17 wizard towers)
  multi-archer_tower: archertower  # merged archer visual (2× maxed TH15 archer towers)

# Render these sprites but skip YOLO txt until a class exists in the 16-head model.
# keremberke has no `wall` class — still composite wall sprites as scenery-like
# context so the detector focuses on defenses.
yolo_unlabeled:
  - archertower
  - firespitter
  - spelltower
  - wall
  - monolith
  - tesla
  - builderhut
  - multi-gear_tower
  - revenge_tower

# ClashKing has no poison/rage/invisibility/lightning filenames.
# The four designs are spell_tower/level_1.webp … level_4.webp.
# Wiki count is 2 towers; do not place_all four designs.
random_sprite_variants:
  spelltower:
    slug: spell_tower
    place_all: false
    files:
      - spell_tower/level_1.webp
      - spell_tower/level_2.webp
      - spell_tower/level_3.webp
      - spell_tower/level_4.webp

# Fallback TH windows if th_unlocks.yaml is missing. Canonical table:
# data-pipeline/src/renderer/sprites/th_unlocks.yaml (see knowledge-base/SOURCES.md).
# Spell towers: wiki 2 at TH15–18; generator skips TH15 (user 2026-08-17).
era_availability:
  eagle:
    min_th: 11
    max_th: 16
    removed_at: 17
    count_range: [1, 1]
  firespitter:
    min_th: 17
  spelltower:
    min_th: 15
    max_th: 18
    generator_skip_th: [15]
    count_range: [2, 2]
  monolith:
    min_th: 15
    count_range: [1, 1]
  tesla:
    min_th: 7
  builderhut:
    min_th: 14
  multi-gear_tower:
    min_th: 17
    count_range: [1, 1]
  revenge_tower:
    min_th: 18
    count_range: [1, 1]

# User-corrected merge rules (not the visual-tier-proxy heuristic).
# Regular cannon files: cannon/level_1.webp … level_21.webp (no geared-up extras
# in this folder). level_21 is the purple max; maxed at TH15 — do not show
# regular cannons as upgradable past TH15.
# TH16+: two maxed purple cannons → ricochet_cannon.
# Archer towers match cannons: archer_tower/level_21.webp is the purple TH15 max.
# TH16+: multi-archer_tower only (no regular archer towers).
# Wizard towers max at TH17 (wizard_tower/level_17.webp). TH15/16 = max-2 / max-1
# relative to that. TH18: two wizard towers → super_wizard_tower.
# firespitter is a separate TH17 defense, not the wizard merge.
era_merges:
  canon:
    regular_slug: cannon
    max_regular_th: 15
    merged_slug: ricochet_cannon
    merged_from_th: 16
    yolo_class: canon
    count_range: [2, 3]  # 2→1 merge; prefer 2–3 ricochets for visual density
  archertower:
    regular_slug: archer_tower
    max_regular_th: 15
    merged_slug: multi-archer_tower
    merged_from_th: 16
    yolo_class: archertower
    count_range: [2, 3]
  wizztower:
    regular_slug: wizard_tower
    max_regular_th: 17
    merged_slug: super_wizard_tower
    merged_from_th: 18
    yolo_class: wizztower
    count_range: [1, 3]

# Explicit slug = identity (for schema strings that match ClashKing names)
identity:
  - air_defense
  - air_sweeper
  - archer_tower
  - bomb_tower
  - cannon
  - clan_castle
  - eagle_artillery
  - firespitter
  - hidden_tesla
  - inferno_tower
  - monolith
  - mortar
  - multi-archer_tower
  - multi-gear_tower
  - revenge_tower
  - ricochet_cannon
  - scattershot
  - spell_tower
  - super_wizard_tower
  - town_hall
  - wall
  - wizard_tower
  - x-bow
  - "builder's_hut"

town_hall:
  sprite_slug: town_hall
  # YOLO only has th13; renderer should use decoded town_hall_level for skin
  yolo_class: th13
