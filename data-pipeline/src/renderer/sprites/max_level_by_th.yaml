# Sprite-max policy for synthetic renders — NOT official Clash of Clans caps.
#
# This repo has no verified per-TH upgrade table:
#   - building_type_map.yaml: slug aliases only
#   - ml/configs/th_classes.yaml: YOLO class names only
#   - knowledge-base/: missing
#
# Policy (heuristic: sprite-max, not official CoC cap):
#   - Each image uses a Town Hall in {15, 16}. TH17/18 sprites exist on disk
#     (town_hall/level_17.webp, level_18.webp) but bulk generation stays 15/16
#     until these previews are reviewed.
#   - town_hall sprite level == that image's TH (exact).
#   - Other buildings: random among the highest 2–3 ClashKing sprite files
#     that exist for that building (top of the folder), not mixed low-level skins.
#   - Optional leftover: 1–2 buildings may use the next 2–3 files below that band.
#
# Per-TH official max (cannon at TH15 vs TH16, etc.): TODO unverified.

policy: sprite-max
not_official_coc_cap: true
town_hall_levels_generated: [15, 16]
high_pool_size: 3
leftover_pool_size: 3
leftover_probability: 0.4
leftover_buildings_max: 2

# Highest level_*.webp observed in ClashKing Home Village folders (local download).
# Rows cite the CDN object for that max file. This is sprite coverage, not a TH unlock table.
# Atlas: https://github.com/ClashKingInc/ClashKingAssets
# CDN template: https://assets.clashk.ing/buildings/home-village/{slug}/level_{n}.webp
