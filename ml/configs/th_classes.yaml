deprecated_notes: |
  Hero altar "pad" classes from keremberke's 2021–2024 TH13-era training.
  King/Queen/Royal Champion/Warden pads no longer exist as separate map tiles in
  current bases; the baseline model hallucinates them on ground tiles, decorations,
  and hero-altar-adjacent clutter. Pseudo-labels filter them out by default.
  Use pseudo_label --include-deprecated to retain them (not recommended for review).
  IDs 7/9/10/13 stay reserved so the 4 user-labeled reals are not remapped.

# Class 12 stays th13 so old real labels keep working. TH14–TH18 halls
# are appended after builderhut (IDs 27–31). Storages are IDs 32–34.
# Resource/army buildings are IDs 35–47.
placeholders: []

notes: |
  Indices 0–15 match keremberke/yolov5m-clash-of-clans. Do not shuffle them.
  Class 12 remains th13. Town Halls TH14–TH18 are classes 27–31.
  Gold/Elixir/Dark Elixir storages are classes 32–34 so unlabeled storages
  are less often forced into mortar/xbow. Resource/army buildings are
  classes 35–47 (mines, collectors, drill, camps, barracks, lab, factories,
  workshop, pet house, blacksmith, hero hall). Appended defenses (16–26) are
  trained from synthetic labels. Walls are never labeled.
  ClashKing sprite folders: archer_tower, hidden_tesla, monolith, spell_tower,
