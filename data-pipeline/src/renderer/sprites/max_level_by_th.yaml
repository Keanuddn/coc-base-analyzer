  eagle_artillery: 7  # source: https://assets.clashk.ing/buildings/home-village/eagle_artillery/level_7.webp
  x-bow: 13  # source: https://assets.clashk.ing/buildings/home-village/x-bow/level_13.webp
  scattershot: 7  # source: https://assets.clashk.ing/buildings/home-village/scattershot/level_7.webp
  wizard_tower: 17  # source: https://assets.clashk.ing/buildings/home-village/wizard_tower/level_17.webp
